[users]
# The same users as http/src/test/resources/local-shiro-users.ini, same passwords.
# format: username = bcrypt or argon2 hash, role1, role2, ...
# A new hash: HashUtil.toBCryptPassword("password").getCanonicalID()
local-admin = "$argon2id$v=19$m=15360,t=3,p=2$6WNSBe6QmQ5Xbn7VeNoV56FZOf0+CtnxbqPZJGVYitw$tloe3LT2CtYLKLWu0tAfHAej7/jLOcQbFYQDAgjhgTY", admin
app-user = $2a$10$xGwjGGQ3RxR7iVQ8dKR5bOJsbXHN1Wibq6crS7gjrFscAn771lTWe, app
device-user = $2a$10$IRNn9O06ROSQuX88IzcQ4uDzqPh5XDc2oNJRVNG05JbF3ClgD3ZOy, device
system-user = $2a$10$dyIoIQ2seqCO.q7WTuZy0eU3bgMAduSx0RqR12tPzR/RvADl4L0pm, system, app, mcp

[roles]
# format: roleName = perm1, perm2, ...
admin = *
# grants the /mcp endpoint
mcp = mcp:access
user = user:create, user:update, user:register
device = device:ping
system = system:reboot, system:shutdown, system:ping
app = app:shutdown, app:logger:read, app:logger:write
